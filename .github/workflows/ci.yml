name: QA Automation e Extração de Dados

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite rodar o teste manualmente no GitHub

jobs:
  testes-e2e:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Navegadores do Playwright
      run: playwright install --with-deps

    - name: Rodar Testes Pytest
      run: pytest tests/ --html=report.html --self-contained-html

    - name: Salvar Relatório de Qualidade
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: relatorio-pytest
        path: report.html